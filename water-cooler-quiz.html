<!-- MAXCOOL — Section แบบสอบถามค้นหารุ่นตู้ทำน้ำเย็น (Product Finder Quiz) -->
<!-- วิธีใช้: วางทั้งก้อนนี้ใน "Custom HTML" block (Gutenberg) หรือ Elementor "HTML" widget -->
<!-- หมายเหตุ: โค้ดถูกออกแบบให้ทน WordPress wpautop (ไม่มีบรรทัดว่าง + JS ไม่มีสตริงแท็ก HTML) -->
<!-- โครงสร้าง: CSS + HTML + JS อยู่รวมในไฟล์เดียว รองรับทุกขนาดหน้าจอ -->
<style>
  /* โหลดฟอนต์ Noto Sans Thai จาก Google Fonts ผ่าน @import (เลี่ยงแท็ก <link> ที่ wpautop ชอบตัด) */
  @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap");
  /* ===== 1.1 ตัวแปรสี / ขนาดตัวอักษร (แก้ที่นี่ที่เดียว) ===== */
  #mc-quiz {
    /* ---- ขนาดตัวอักษร (font-size scale ตาม spec) ---- */
    --fs-h2: clamp(26px, 2.8vw, 40px);
    --fw-h2: 600;
    --fs-h3: clamp(18px, 1.75vw, 25px);
    --fw-h3: 600;
    --fs-p: clamp(15px, 1.6vw, 23px);
    --fs-button: clamp(15px, 1.25vw, 18px);
    --fs-lg: clamp(17px, 1.5vw, 21px);
    --fs-base: clamp(15px, 1.3vw, 18px);
    --fs-sm: clamp(13px, 1.1vw, 15px);
    /* ---- สีพื้นหลัง / ตัวอักษร ---- */
    --color-bg: #011035;
    --color-btn-bg: #04122d;
    --color-text: #f3f5f7;
    /* ---- สีขอบกล่องคำถาม ---- */
    --border-main: #2D66AB;
    --border-highlight: #7FC1F5;
    --border-dark-edge: #0A2E5B;
    --glow: rgba(30, 136, 255, 0.28);
    /* ---- สีวงกลมติ๊กถูกหน้าตัวเลือก ---- */
    --circle-top: #23CFFF;
    --circle-center: #168DFF;
    --circle-bottom: #115CFF;
    --circle-border: #5FE6FF;
    --circle-glow: rgba(35, 207, 255, 0.45);
    /* ---- ความหนาขอบ (วงกลม + กล่องตัวเลือก) = 1px ตาม spec ---- */
    --border-width: 1px;
    /* ---- ฟอนต์หลัก ---- */
    font-family: "Noto Sans Thai", sans-serif;
  }
  /* ===== 1.2 กล่อง section หลัก — พื้นหลัง + ความสูงขั้นต่ำ 105vh ===== */
  #mc-quiz {
    box-sizing: border-box;
    min-height: 105vh;
    background: var(--color-bg);
    color: var(--color-text);
    padding: clamp(28px, 5vw, 72px) clamp(16px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* reset box-sizing ให้ทุก element ภายใน section */
  #mc-quiz *,
  #mc-quiz *::before,
  #mc-quiz *::after {
    box-sizing: border-box;
  }
  /* ===== 1.3 หัวเรื่อง (H2) + คำอธิบาย (P) ===== */
  #mc-quiz .mc-head {
    width: 100%;
    max-width: 920px;
    text-align: center;
    margin-bottom: clamp(24px, 4vw, 44px);
  }
  #mc-quiz .mc-head h2 {
    margin: 0 0 12px 0;
    font-size: var(--fs-h2);
    font-weight: var(--fw-h2);
    line-height: 1.2;
  }
  #mc-quiz .mc-head p {
    margin: 0 auto;
    max-width: 720px;
    font-size: var(--fs-p);
    line-height: 1.5;
    color: #c8d4e6;
  }
  /* ===== 1.4 กล่องหลัก + ตัวบอกขั้นตอน (progress) ===== */
  #mc-quiz .mc-shell {
    width: 100%;
    max-width: 1180px;
  }
  #mc-quiz .mc-progress {
    margin-bottom: 14px;
  }
  #mc-quiz .mc-progress-label {
    display: block;
    margin-bottom: 10px;
    font-size: var(--fs-sm);
    color: #9fb2cc;
  }
  /* รางของ progress bar */
  #mc-quiz .mc-progress-track {
    display: flex;
    gap: 10px;
  }
  /* แต่ละช่วงของ progress bar */
  #mc-quiz .mc-progress-seg {
    flex: 1;
    height: 5px;
    border-radius: 999px;
    background: #0a2350;
    overflow: hidden;
  }
  /* ช่วงที่ active (ทำถึงแล้ว) */
  #mc-quiz .mc-progress-seg.is-active {
    background: linear-gradient(90deg, var(--circle-center), var(--circle-top));
  }
  /* ===== 1.5 การ์ดคำถาม — ขอบเรืองแสง ===== */
  #mc-quiz .mc-card {
    margin-top: 22px;
    padding: clamp(20px, 3vw, 40px);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(6, 22, 55, 0.9), rgba(3, 14, 40, 0.9));
    border: var(--border-width) solid var(--border-main);
    box-shadow:
      0 0 0 1px var(--border-dark-edge),
      0 0 30px var(--glow),
      inset 0 0 22px rgba(127, 193, 245, 0.06);
  }
  /* ===== 1.6 หัวคำถามภายในการ์ด: ป้ายตัวเลข + คำถาม (H3) + คำอธิบาย ===== */
  #mc-quiz .mc-q-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: clamp(16px, 2vw, 24px);
  }
  /* ป้ายตัวเลขข้อ */
  #mc-quiz .mc-q-num {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: var(--fs-base);
    font-weight: 600;
    color: var(--color-text);
    background: radial-gradient(circle at 50% 35%, var(--circle-top), var(--circle-center) 55%, var(--circle-bottom));
    border: var(--border-width) solid var(--circle-border);
    box-shadow: 0 0 14px var(--circle-glow);
  }
  #mc-quiz .mc-q-text h3 {
    margin: 6px 0 6px 0;
    font-size: var(--fs-h3);
    font-weight: var(--fw-h3);
    line-height: 1.35;
  }
  #mc-quiz .mc-q-text p {
    margin: 0;
    font-size: var(--fs-base);
    line-height: 1.5;
    color: #b9c8de;
  }
  /* ===== 1.7 รายการตัวเลือก ===== */
  #mc-quiz .mc-choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  /* กล่องตัวเลือกแต่ละอัน */
  #mc-quiz .mc-choice {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    padding: clamp(14px, 1.8vw, 20px) clamp(16px, 2vw, 24px);
    border-radius: 16px;
    background: var(--color-btn-bg);
    border: var(--border-width) solid var(--border-dark-edge);
    color: var(--color-text);
    font-family: inherit;
    font-size: var(--fs-lg);
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  /* hover / focus ของตัวเลือก */
  #mc-quiz .mc-choice:hover,
  #mc-quiz .mc-choice:focus-visible {
    border-color: var(--border-main);
    box-shadow: 0 0 16px var(--glow);
    outline: none;
  }
  /* สถานะเมื่อถูกเลือก */
  #mc-quiz .mc-choice.is-selected {
    border-color: var(--border-highlight);
    box-shadow: 0 0 20px var(--glow);
  }
  /* ===== 1.8 วงกลมติ๊กถูกหน้าตัวเลือก (วาดด้วย CSS ล้วน ไม่ใช้ SVG) ===== */
  #mc-quiz .mc-tick {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    /* วงกลมว่าง (ยังไม่เลือก) */
    border: var(--border-width) solid #3d5680;
    background: transparent;
    transition: background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  /* เครื่องหมายติ๊กถูก (ซ่อนไว้ก่อน) วาดจากขอบสองด้านหมุน 45 องศา */
  #mc-quiz .mc-tick::after {
    content: "";
    width: 6px;
    height: 11px;
    margin-top: -2px;
    border: solid #ffffff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0.4);
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  /* เมื่อเลือกแล้ว: วงกลมไล่เฉดฟ้า + เรืองแสง + โชว์ติ๊กถูก */
  #mc-quiz .mc-choice.is-selected .mc-tick {
    border-color: var(--circle-border);
    background: radial-gradient(circle at 50% 30%, var(--circle-top), var(--circle-center) 55%, var(--circle-bottom));
    box-shadow: 0 0 12px var(--circle-glow);
  }
  #mc-quiz .mc-choice.is-selected .mc-tick::after {
    opacity: 1;
    transform: rotate(45deg) scale(1);
  }
  /* ===== 1.9 แถวปุ่มควบคุม (ย้อนกลับ / ถัดไป / ดูรุ่นที่แนะนำ) ===== */
  #mc-quiz .mc-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-top: clamp(20px, 3vw, 30px);
  }
  /* ปุ่มพื้นฐาน */
  #mc-quiz .mc-btn {
    font-family: inherit;
    font-size: var(--fs-button);
    font-weight: 600;
    padding: 12px clamp(20px, 3vw, 34px);
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.18s ease, opacity 0.18s ease, background 0.18s ease;
  }
  /* ปุ่มรอง (ย้อนกลับ) */
  #mc-quiz .mc-btn-ghost {
    background: transparent;
    color: var(--color-text);
    border: var(--border-width) solid var(--border-main);
  }
  #mc-quiz .mc-btn-ghost:hover {
    box-shadow: 0 0 14px var(--glow);
  }
  /* ปุ่มหลัก (ถัดไป / ดูรุ่นที่แนะนำ) */
  #mc-quiz .mc-btn-primary {
    background: linear-gradient(180deg, var(--circle-center), var(--circle-bottom));
    color: #ffffff;
    border: var(--border-width) solid var(--circle-border);
    box-shadow: 0 0 16px var(--glow);
  }
  #mc-quiz .mc-btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 22px var(--circle-glow);
  }
  /* ปุ่มที่ยังกดไม่ได้ (ยังไม่เลือกคำตอบ) */
  #mc-quiz .mc-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  /* ซ่อนปุ่มย้อนกลับแต่คงตำแหน่งปุ่มถัดไปไว้ทางขวา */
  #mc-quiz .mc-btn.is-hidden {
    visibility: hidden;
  }
  /* ===== 1.10 การ์ดผลลัพธ์ (รูปซ้าย / ข้อความขวา) ===== */
  #mc-quiz .mc-result {
    margin-top: 22px;
  }
  #mc-quiz .mc-result h3 {
    margin: 0 0 8px 0;
    font-size: var(--fs-h3);
    font-weight: var(--fw-h3);
  }
  #mc-quiz .mc-result > p {
    margin: 0 0 20px 0;
    font-size: var(--fs-p);
    line-height: 1.5;
    color: #c8d4e6;
    max-width: 760px;
  }
  /* กล่องการ์ดผลลัพธ์ (2 คอลัมน์บนจอใหญ่) */
  #mc-quiz .mc-result-card {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    gap: clamp(20px, 3vw, 44px);
    align-items: center;
    padding: clamp(18px, 2.5vw, 34px);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(6, 22, 55, 0.9), rgba(3, 14, 40, 0.9));
    border: var(--border-width) solid var(--border-main);
    box-shadow:
      0 0 0 1px var(--border-dark-edge),
      0 0 30px var(--glow);
  }
  /* คอนเทนเนอร์รูปตู้ (ฝั่งซ้าย) */
  #mc-quiz .mc-result-media {
    border-radius: 16px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0a2a5e, #020c26 70%);
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
  }
  /* รูปตู้ให้ responsive เต็มกล่อง */
  #mc-quiz .mc-result-media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* ข้อความฝั่งขวา: ชื่อรุ่น + ปุ่ม CTA */
  #mc-quiz .mc-result-body h4 {
    margin: 0 0 20px 0;
    font-size: var(--fs-h3);
    font-weight: var(--fw-h3);
    line-height: 1.3;
  }
  /* ปุ่ม "ดูรายละเอียด" */
  #mc-quiz .mc-cta {
    display: inline-block;
    text-decoration: none;
    font-size: var(--fs-button);
    font-weight: 600;
    color: #ffffff;
    padding: 13px clamp(24px, 3vw, 40px);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--circle-center), var(--circle-bottom));
    border: var(--border-width) solid var(--circle-border);
    box-shadow: 0 0 16px var(--glow);
    transition: transform 0.15s ease, box-shadow 0.18s ease;
  }
  #mc-quiz .mc-cta:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 22px var(--circle-glow);
  }
  /* ปุ่ม "ตอบใหม่" ใต้การ์ดผลลัพธ์ */
  #mc-quiz .mc-restart {
    margin-top: 22px;
  }
  /* ===== 1.11 utility: ซ่อน element (สลับ view คำถาม/ผลลัพธ์) ===== */
  #mc-quiz .mc-is-hidden {
    display: none !important;
  }
  /* ===== 1.12 Responsive: แท็บเล็ต / มือถือ ===== */
  /* จอ ≤ 720px: การ์ดผลลัพธ์เป็นคอลัมน์เดียว (รูปบน / ข้อความล่าง) */
  @media (max-width: 720px) {
    #mc-quiz .mc-result-card {
      grid-template-columns: 1fr;
    }
    #mc-quiz .mc-result-media {
      max-width: 360px;
      margin: 0 auto;
    }
  }
  /* จอ ≤ 480px: ปุ่ม nav เต็มความกว้าง อ่านง่ายบนมือถือ */
  @media (max-width: 480px) {
    #mc-quiz .mc-nav {
      flex-wrap: wrap;
    }
    #mc-quiz .mc-btn {
      flex: 1 1 auto;
      text-align: center;
    }
  }
</style>
<!-- ===== ส่วนที่ 2: โครงสร้าง HTML ของ section ===== -->
<!-- หมายเหตุ: ภายใน <section> จงใจไม่ใส่ HTML comment เพราะ WordPress wpautop จะห่อ comment -->
<!-- ด้วยแท็ก <p> แล้วทำให้ layout (โดยเฉพาะ grid การ์ดผลลัพธ์) เพี้ยน — คำอธิบายอยู่ใน CSS/JS แทน -->
<section id="mc-quiz" aria-labelledby="mc-quiz-title">
  <header class="mc-head">
    <h2 id="mc-quiz-title">ค้นหารุ่นที่ใช่สำหรับคุณ</h2>
    <p>แบบสอบถามสั้น ๆ ที่จะช่วยคุณเลือกรุ่นตู้ทำน้ำเย็นแบบต่อท่อที่เหมาะกับการใช้งานของคุณ</p>
  </header>
  <div class="mc-shell">
    <div class="mc-progress" id="mc-progress">
      <span class="mc-progress-label" id="mc-progress-label">ขั้นตอนที่ 1 จาก 3</span>
      <div class="mc-progress-track">
        <div class="mc-progress-seg is-active" data-seg="0"></div>
        <div class="mc-progress-seg" data-seg="1"></div>
        <div class="mc-progress-seg" data-seg="2"></div>
      </div>
    </div>
    <div id="mc-question-view">
      <div class="mc-card" id="mc-card"></div>
      <div class="mc-nav">
        <button type="button" class="mc-btn mc-btn-ghost is-hidden" id="mc-back">ย้อนกลับ</button>
        <button type="button" class="mc-btn mc-btn-primary" id="mc-next" disabled>ถัดไป</button>
      </div>
    </div>
    <div id="mc-result-view" class="mc-is-hidden">
      <div class="mc-result">
        <h3>รุ่นที่แนะนำสำหรับคุณ</h3>
        <p>จากคำตอบของคุณ นี่คือรุ่นตู้ทำน้ำเย็นแบบต่อท่อที่เหมาะกับหน้างานของคุณมากที่สุด</p>
        <div class="mc-result-card">
          <div class="mc-result-media">
            <img id="mc-result-img" src="" alt="ภาพตู้ทำน้ำเย็นแบบต่อท่อของ MAXCOOL" loading="lazy">
          </div>
          <div class="mc-result-body">
            <h4 id="mc-result-title">—</h4>
            <a class="mc-cta" id="mc-result-cta" href="#">ดูรายละเอียด</a>
          </div>
        </div>
      </div>
      <div class="mc-restart">
        <button type="button" class="mc-btn mc-btn-ghost" id="mc-restart">ตอบใหม่</button>
      </div>
    </div>
  </div>
</section>
<!-- ===== ส่วนที่ 3: JavaScript (สร้าง DOM ด้วย createElement ล้วน ไม่มีสตริงแท็ก HTML เพื่อกัน wpautop) ===== -->
<script>
(function () {
  "use strict";
  /* 3.1 ฐาน URL ของหน้า configurator */
  /* TODO (งานตรวจสอบแยก): ยืนยันว่าหน้า configurator อ่าน query param `config` จริง อย่าสมมติเอง */
  var CONFIGURATOR_BASE = "/products/water-dispenser";
  /* 3.2 PIPE_ROUTES — ผลลัพธ์สาย "ต่อท่อน้ำประปาโดยตรง" (Q1 จบทันที) */
  var PIPE_ROUTES = {
    direct: {
      title: "ตู้ทำน้ำเย็นแบบต่อท่อ",
      alt: "ตู้ทำน้ำเย็นแบบต่อท่อน้ำประปาโดยตรงของ MAXCOOL",
      image: "",
      config: "pipe-direct"
    }
  };
  /* 3.3 TANK_ROUTES — ผลลัพธ์สาย "เติมน้ำเอง" (5 รุ่นตามตารางบรีฟ) */
  /* key = <ประเภทน้ำ>|<ระบบระบายความร้อน> (สาย hot ไม่มีระบายความร้อน ใช้ key = "hot") */
  /* slug ด้านล่างเป็น PLACEHOLDER — ส่ง slug จริงมาแก้ทีหลังได้ */
  var TANK_ROUTES = {
    /* #1 น้ำเย็น + แผงร้อน */
    "cold|radiator": {
      title: "ตู้ทำน้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยแผงร้อน",
      alt: "ตู้ทำน้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยแผงร้อนของ MAXCOOL",
      image: "",
      config: "tank-cold-radiator"
    },
    /* #2 น้ำเย็น + รังผึ้ง */
    "cold|honeycomb": {
      title: "ตู้ทำน้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยรังผึ้ง",
      alt: "ตู้ทำน้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยรังผึ้งของ MAXCOOL",
      image: "",
      config: "tank-cold-honeycomb"
    },
    /* #3 ร้อน-เย็น + รังผึ้ง */
    "hotcold|honeycomb": {
      title: "ตู้ทำน้ำร้อน-น้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยรังผึ้ง",
      alt: "ตู้ทำน้ำร้อน-น้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยรังผึ้งของ MAXCOOL",
      image: "",
      config: "tank-hotcold-honeycomb"
    },
    /* #4 ร้อน-เย็น + แผงร้อน */
    "hotcold|radiator": {
      title: "ตู้ทำน้ำร้อน-น้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยแผงร้อน",
      alt: "ตู้ทำน้ำร้อน-น้ำเย็นแบบเติมน้ำ ระบายความร้อนด้วยแผงร้อนของ MAXCOOL",
      image: "",
      config: "tank-hotcold-radiator"
    },
    /* #5 น้ำร้อนอย่างเดียว (ไม่ถาม Q3) */
    "hot": {
      title: "ตู้ทำน้ำร้อนแบบเติมน้ำ",
      alt: "ตู้ทำน้ำร้อนแบบเติมน้ำของ MAXCOOL",
      image: "",
      config: "tank-hot"
    }
  };
  /* 3.4 นิยามคำถามทั้งหมด (title, desc, choices) */
  var QUESTIONS = {
    /* คำถามข้อ 1: รูปแบบการติดตั้ง */
    q1: {
      title: "คุณต้องการติดตั้งตู้แบบไหน",
      desc: "เลือกวิธีติดตั้งที่ตรงกับหน้างานของคุณ เพื่อให้เราแนะนำรุ่นได้ถูกต้อง",
      choices: [
        { value: "tank", label: "ติดตั้งง่าย ไม่ต้องเดินท่อน้ำประปา (เติมน้ำเอง)" },
        { value: "pipe", label: "ต่อท่อน้ำประปาโดยตรง" }
      ]
    },
    /* คำถามข้อ 2: ประเภทน้ำ */
    q2: {
      title: "เลือกประเภทน้ำที่ต้องการ",
      desc: "รุ่นตู้แต่ละแบบรองรับประเภทน้ำต่างกัน เลือกให้ตรงกับการใช้งานจริงของคุณ",
      choices: [
        { value: "cold", label: "น้ำเย็น" },
        { value: "hot", label: "น้ำร้อน" },
        { value: "hotcold", label: "รวมน้ำร้อนและน้ำเย็น" }
      ]
    },
    /* คำถามข้อ 3: สภาพแวดล้อม → ระบบระบายความร้อน */
    q3: {
      title: "พิจารณาสภาพแวดล้อมการติดตั้ง",
      desc: "สภาพแวดล้อมหน้างานเป็นตัวกำหนดชนิดของระบบระบายความร้อนที่เหมาะสม เพื่อให้ตู้ทำงานได้เต็มประสิทธิภาพและดูแลรักษาง่ายในระยะยาว",
      choices: [
        { value: "radiator", label: "พื้นที่มีฝุ่นเยอะ ต้องการรุ่นที่ดูแลรักษาง่าย (ระบายความร้อนด้วยแผงร้อน)" },
        { value: "honeycomb", label: "จุดที่มีคนใช้งานเยอะ รองรับการใช้งานหนักและต่อเนื่อง (ระบายความร้อนด้วยรังผึ้ง)" }
      ]
    }
  };
  /* 3.5 สถานะแบบสอบถาม (state) */
  var state = {
    steps: ["q1"],
    current: 0,
    answers: {}
  };
  /* 3.6 อ้างอิง element (query ตอน init หลัง DOM พร้อม) */
  var elCard, elBack, elNext, elRestart, elProgress, elProgressLabel, elProgressSegs;
  var elQuestionView, elResultView, elResultImg, elResultTitle, elResultCta;
  /* 3.7 helper: สร้าง element พร้อม class + ข้อความ (ไม่มีสตริงแท็ก HTML) */
  function make(tag, className, text) {
    var node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text != null) {
      node.textContent = text;
    }
    return node;
  }
  /* 3.8 คำนวณลำดับข้อ (steps) จากคำตอบปัจจุบัน */
  function computeSteps() {
    /* เริ่มด้วยข้อ 1 เสมอ */
    var steps = ["q1"];
    /* ยังไม่ตอบข้อ 1 หรือเลือกต่อท่อ → จบแค่ข้อ 1 */
    if (state.answers.q1 !== "tank") {
      return steps;
    }
    /* เลือกเติมน้ำเอง → มีข้อ 2 */
    steps.push("q2");
    /* ยังไม่ตอบข้อ 2 หรือเลือกน้ำร้อน → จบแค่ข้อ 2 (ข้าม Q3) */
    if (state.answers.q2 !== "cold" && state.answers.q2 !== "hotcold") {
      return steps;
    }
    /* น้ำเย็น หรือ ร้อน-เย็น → มีข้อ 3 */
    steps.push("q3");
    return steps;
  }
  /* 3.9 ตรวจว่าข้อปัจจุบันเป็น "จุดจบ" ของกิ่งหรือยัง */
  function isTerminalStep(stepId) {
    /* pipe จบที่ q1 */
    if (stepId === "q1" && state.answers.q1 === "pipe") {
      return true;
    }
    /* hot จบที่ q2 */
    if (stepId === "q2" && state.answers.q2 === "hot") {
      return true;
    }
    /* q3 เป็นข้อสุดท้ายเสมอ */
    if (stepId === "q3") {
      return true;
    }
    return false;
  }
  /* 3.10 render การ์ดคำถามของข้อปัจจุบัน (สร้าง DOM ด้วย createElement) */
  function renderQuestion() {
    var stepId = state.steps[state.current];
    var q = QUESTIONS[stepId];
    var chosen = state.answers[stepId];
    /* ล้างเนื้อหาการ์ดเดิม */
    elCard.textContent = "";
    /* ---- หัวคำถาม: เลขข้อ + ข้อความ + คำอธิบาย ---- */
    var head = make("div", "mc-q-head");
    var num = make("span", "mc-q-num", String(state.current + 1));
    num.setAttribute("aria-hidden", "true");
    var textWrap = make("div", "mc-q-text");
    var h3 = make("h3", null, q.title);
    var desc = make("p", null, q.desc);
    textWrap.appendChild(h3);
    textWrap.appendChild(desc);
    head.appendChild(num);
    head.appendChild(textWrap);
    elCard.appendChild(head);
    /* ---- รายการตัวเลือก ---- */
    var list = make("div", "mc-choices");
    list.setAttribute("role", "radiogroup");
    list.setAttribute("aria-label", q.title);
    for (var i = 0; i < q.choices.length; i++) {
      var c = q.choices[i];
      var isSel = chosen === c.value;
      /* ปุ่มตัวเลือก */
      var btn = make("button", "mc-choice" + (isSel ? " is-selected" : ""));
      btn.setAttribute("type", "button");
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-checked", isSel ? "true" : "false");
      btn.setAttribute("data-value", c.value);
      /* วงกลมติ๊กถูก (เครื่องหมายวาดด้วย CSS ::after) */
      var tick = make("span", "mc-tick");
      tick.setAttribute("aria-hidden", "true");
      /* ข้อความตัวเลือก */
      var label = make("span", null, c.label);
      btn.appendChild(tick);
      btn.appendChild(label);
      btn.addEventListener("click", onChoiceClick);
      list.appendChild(btn);
    }
    elCard.appendChild(list);
    /* อัปเดตปุ่มควบคุม + progress */
    updateNavAndProgress();
  }
  /* 3.11 เมื่อคลิกตัวเลือก: บันทึกคำตอบ + คำนวณ steps ใหม่ */
  function onChoiceClick(e) {
    var stepId = state.steps[state.current];
    var value = e.currentTarget.getAttribute("data-value");
    /* บันทึกคำตอบ */
    state.answers[stepId] = value;
    /* ล้างคำตอบของข้อที่อยู่หลังข้อนี้ (เผื่อกิ่งเปลี่ยน) */
    clearAnswersAfter(state.current);
    /* คำนวณลำดับข้อใหม่ */
    state.steps = computeSteps();
    /* อัปเดตสถานะเลือกของปุ่มทุกอัน */
    var buttons = elCard.querySelectorAll(".mc-choice");
    for (var i = 0; i < buttons.length; i++) {
      var sel = buttons[i] === e.currentTarget;
      buttons[i].classList.toggle("is-selected", sel);
      buttons[i].setAttribute("aria-checked", sel ? "true" : "false");
    }
    /* เปิดปุ่มถัดไป/ดูผล */
    updateNavAndProgress();
  }
  /* 3.12 ล้างคำตอบของทุกข้อที่อยู่หลัง index ที่กำหนด */
  function clearAnswersAfter(index) {
    for (var i = index + 1; i < state.steps.length; i++) {
      delete state.answers[state.steps[i]];
    }
  }
  /* 3.13 อัปเดตปุ่มควบคุม (ย้อนกลับ/ถัดไป) + แถบ progress */
  function updateNavAndProgress() {
    var stepId = state.steps[state.current];
    var answered = !!state.answers[stepId];
    /* ปุ่มย้อนกลับ: โชว์เมื่อไม่ใช่ข้อแรก */
    if (state.current > 0) {
      elBack.classList.remove("is-hidden");
    } else {
      elBack.classList.add("is-hidden");
    }
    /* ปุ่มถัดไป: เปิดได้เมื่อเลือกคำตอบแล้ว */
    elNext.disabled = !answered;
    /* ข้อความปุ่มถัดไป: ถ้าเป็นจุดจบ → "ดูรุ่นที่แนะนำ" */
    if (isTerminalStep(stepId)) {
      elNext.textContent = "ดูรุ่นที่แนะนำ";
    } else {
      elNext.textContent = "ถัดไป";
    }
    /* แถบ progress: total = จำนวนข้อในกิ่งปัจจุบัน */
    var total = state.steps.length;
    elProgressLabel.textContent = "ขั้นตอนที่ " + (state.current + 1) + " จาก " + total;
    for (var i = 0; i < elProgressSegs.length; i++) {
      var active = i <= state.current && i < total;
      elProgressSegs[i].classList.toggle("is-active", active);
    }
  }
  /* 3.14 ปุ่มถัดไป / ดูรุ่นที่แนะนำ */
  function onNext() {
    var stepId = state.steps[state.current];
    /* ยังไม่เลือกคำตอบ → ไม่ทำอะไร */
    if (!state.answers[stepId]) {
      return;
    }
    /* เป็นจุดจบ → แสดงผลลัพธ์ */
    if (isTerminalStep(stepId)) {
      showResult();
      return;
    }
    /* ไปข้อถัดไป */
    state.current += 1;
    renderQuestion();
  }
  /* 3.15 ปุ่มย้อนกลับ */
  function onBack() {
    if (state.current > 0) {
      state.current -= 1;
      renderQuestion();
    }
  }
  /* 3.16 หา route ผลลัพธ์จากคำตอบทั้งหมด */
  function resolveRoute() {
    /* สาย pipe */
    if (state.answers.q1 === "pipe") {
      return PIPE_ROUTES.direct;
    }
    /* สาย tank */
    var water = state.answers.q2;
    /* น้ำร้อนอย่างเดียว → #5 */
    if (water === "hot") {
      return TANK_ROUTES["hot"];
    }
    /* น้ำเย็น หรือ ร้อน-เย็น → รวมกับระบบระบายความร้อน (Q3) */
    var cooling = state.answers.q3;
    var key = water + "|" + cooling;
    return TANK_ROUTES[key];
  }
  /* 3.17 แสดงการ์ดผลลัพธ์ (ซ่อนคำถาม → โชว์ผลลัพธ์ตำแหน่งเดิม) */
  function showResult() {
    var route = resolveRoute();
    /* กันกรณีหา route ไม่เจอ */
    if (!route) {
      return;
    }
    /* ชื่อรุ่น */
    elResultTitle.textContent = route.title;
    /* รูป + alt */
    if (route.image) {
      elResultImg.setAttribute("src", route.image);
    } else {
      elResultImg.removeAttribute("src");
    }
    elResultImg.setAttribute("alt", route.alt);
    /* href ของ CTA ชี้ไปหน้า configurator พร้อม query param config */
    var href = CONFIGURATOR_BASE + "?config=" + encodeURIComponent(route.config);
    elResultCta.setAttribute("href", href);
    /* ซ่อน view คำถาม + progress, โชว์ view ผลลัพธ์ */
    elQuestionView.classList.add("mc-is-hidden");
    elProgress.classList.add("mc-is-hidden");
    elResultView.classList.remove("mc-is-hidden");
  }
  /* 3.18 ปุ่มตอบใหม่ — รีเซ็ตกลับข้อ 1 */
  function onRestart() {
    state.steps = ["q1"];
    state.current = 0;
    state.answers = {};
    elResultView.classList.add("mc-is-hidden");
    elQuestionView.classList.remove("mc-is-hidden");
    elProgress.classList.remove("mc-is-hidden");
    renderQuestion();
  }
  /* 3.19 ทำความสะอาด DOM เผื่อ WordPress wpautop แทรกแท็กขึ้นบรรทัดใหม่หรือย่อหน้าว่างเข้ามาใน section */
  function sanitizeDom() {
    var root = document.getElementById("mc-quiz");
    if (!root) {
      return;
    }
    /* ลบแท็กขึ้นบรรทัดใหม่ที่ถูกแทรกระหว่างปุ่ม/องค์ประกอบ inline */
    var brs = root.querySelectorAll("br");
    for (var i = 0; i < brs.length; i++) {
      brs[i].parentNode.removeChild(brs[i]);
    }
    /* ลบย่อหน้าที่ว่างเปล่า (ไม่มีข้อความ) ซึ่งมักเกิดจาก wpautop ห่อ comment */
    var ps = root.querySelectorAll("p");
    for (var j = 0; j < ps.length; j++) {
      if (ps[j].textContent.trim() === "" && ps[j].children.length === 0) {
        ps[j].parentNode.removeChild(ps[j]);
      }
    }
  }
  /* 3.20 init: query element + ผูก event + render ข้อ 1 */
  function init() {
    /* ล้าง DOM ที่ wpautop อาจทำเพี้ยนก่อน */
    sanitizeDom();
    elCard = document.getElementById("mc-card");
    elBack = document.getElementById("mc-back");
    elNext = document.getElementById("mc-next");
    elRestart = document.getElementById("mc-restart");
    elProgress = document.getElementById("mc-progress");
    elProgressLabel = document.getElementById("mc-progress-label");
    elProgressSegs = document.querySelectorAll("#mc-progress .mc-progress-seg");
    elQuestionView = document.getElementById("mc-question-view");
    elResultView = document.getElementById("mc-result-view");
    elResultImg = document.getElementById("mc-result-img");
    elResultTitle = document.getElementById("mc-result-title");
    elResultCta = document.getElementById("mc-result-cta");
    /* ถ้าหา element หลักไม่เจอ (โครงสร้างถูกแก้) → หยุดอย่างเงียบ ๆ */
    if (!elCard || !elNext) {
      return;
    }
    elNext.addEventListener("click", onNext);
    elBack.addEventListener("click", onBack);
    elRestart.addEventListener("click", onRestart);
    renderQuestion();
  }
  /* 3.21 เรียก init เมื่อ DOM พร้อม (รองรับกรณี script ถูกย้าย/defer โดยปลั๊กอิน) */
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
