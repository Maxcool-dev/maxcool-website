<div class="mxc-tabs">

  <style>

    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=swap');

    .mxc-tabs *{box-sizing:border-box}
    .mxc-tabs{
      --mxc-font:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
    }
    .mxc-tabs .sectabs{
      position:sticky;top:0;z-index:30;
      width:100vw;
      margin-left:calc(50% - 50vw);
      background:rgba(25,32,41,.92);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-top:1px solid rgba(255,255,255,.08);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 8px 28px rgba(0,0,0,.28);
      min-height:92px;
      display:flex;
      align-items:center;
    }
    .mxc-tabs .sectabs-inner{
      display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;
      padding:3px 32px;
      max-width:1180px;
      margin:0 auto;
    }
    .mxc-tabs .stab{
      display:inline-flex;align-items:center;justify-content:center;gap:11px;
      font-family:var(--mxc-font);font-size:18px;font-weight:600;line-height:1;
      text-decoration:none;
      color:#dfe5ec;
      padding:13px 28px;border-radius:300px;cursor:pointer;
      background:#04122d;
      border:1px solid #75aedf;
      transition:.22s ease;white-space:nowrap;
      position:relative;
    }
    .mxc-tabs .stab .nicon{width:36px;height:36px;flex:none;stroke:#fff;stroke-width:1.5;
      stroke-linecap:round;stroke-linejoin:round;fill:none}
    .mxc-tabs .stab .nicon .acc{stroke:#4a9eff}
    .mxc-tabs .stab .nicon .accf{fill:#4a9eff;stroke:none}
    .mxc-tabs .stab:hover{background:#0a1d40;border-color:#a9cdf0;transform:translateY(-1px)}

    /* ── Active state: เปลี่ยนพื้น + blue aura หลายชั้น ── */
    .mxc-tabs .stab.active{
      background:linear-gradient(135deg,#0d2a6e 0%,#071c4a 100%);
      border-color:#5ab4ff;
      color:#fff;
      transform:translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(90,180,255,.35),
        0 0 18px 5px rgba(74,158,255,.20),
        0 6px 18px rgba(74,158,255,.18);
    }
    .mxc-tabs .stab.active .nicon .acc{stroke:#7dd0ff}
    .mxc-tabs .stab.active .nicon .accf{fill:#7dd0ff}

    @media (max-width:560px){
      .mxc-tabs .sectabs-inner{gap:8px;padding:11px 14px}
      .mxc-tabs .stab{font-size:14px;padding:10px 16px;gap:8px}
      .mxc-tabs .stab .nicon{width:28px;height:28px}
    }

  </style>

  <nav class="sectabs" aria-label="Section navigation">
    <div class="sectabs-inner">
      <!-- href ต้องตรงกับ id ของ section ในหน้า -->

  <script>
  (function(){
    /* smooth scroll สำหรับ browser ที่ยังไม่รองรับ scroll-behavior:smooth บน anchor */
    document.documentElement.style.scrollBehavior = 'smooth';

    var root = document.currentScript ? document.currentScript.closest('.mxc-tabs') : null;
    if(!root){ var all=document.querySelectorAll('.mxc-tabs'); root=all[all.length-1]; }
    if(!root) return;

    var tabs = [].slice.call(root.querySelectorAll('.stab'));
    if(!tabs.length) return;

    function setActive(tab){ tabs.forEach(function(t){ t.classList.toggle('active', t===tab); }); }

    var lockUntil = 0, forced = null;
    tabs.forEach(function(t){
      t.addEventListener('click', function(e){
        e.preventDefault();
        var href = t.getAttribute('href') || '';
        var sec = href.charAt(0)==='#' && href.length>1 ? document.getElementById(href.slice(1)) : null;
        if(sec){
          /* หักลบความสูง sticky bar ออก + padding 12px */
          var barH = bar ? bar.getBoundingClientRect().height : 92;
          var top = sec.getBoundingClientRect().top + window.scrollY - barH - 12;
          window.scrollTo({ top: top, behavior: 'smooth' });
        }
        forced = t; setActive(t); lockUntil = (window.performance?performance.now():Date.now()) + 900;
      });
    });

    var map = tabs.map(function(t){
      var href = t.getAttribute('href') || '';
      var sec = href.charAt(0)==='#' && href.length>1 ? document.getElementById(href.slice(1)) : null;
      return { tab:t, sec:sec };
    }).filter(function(m){ return m.sec; });

    var bar = root.querySelector('.sectabs');
    var SECTION_OFFSET = 0;
    function getStickyOffset(){
      if(bar){ return bar.getBoundingClientRect().bottom + SECTION_OFFSET; }
      return 76 + SECTION_OFFSET;
    }

    function now(){ return window.performance?performance.now():Date.now(); }

    function update(){
      if(!map.length) return;
      if(now()<lockUntil) return;
      forced = null;
      var offset = getStickyOffset();
      var current = map[0].tab;
      map.forEach(function(m){
        if(m.sec.getBoundingClientRect().top - offset <= 0) current = m.tab;
      });
      if(window.innerHeight+window.scrollY >= document.documentElement.scrollHeight-2){
        current = map[map.length-1].tab;
      }
      setActive(current);
    }

    if(map.length){
      var ticking=false;
      window.addEventListener('scroll', function(){
        if(forced) setActive(forced);
        if(!ticking){ ticking=true; requestAnimationFrame(function(){ ticking=false; update(); }); }
      }, {passive:true});
      window.addEventListener('resize', update);
      update();
    } else {
      setActive(tabs[0]);
    }
  })();
  </script>

</div>
